[package]
name = "Hydra_drive"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["hydra-drive-core","hydra-virtual-drive-helper"]

[dependencies]
junction = "2.1.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts"] }
rfd = "0.15"
winfsp = { version = "0.12", features = ["build"] }
widestring = "1"
windows-sys = { version = "0.60", features = ["Win32_Storage_FileSystem"] }
sysinfo = "0.33"
hydra-drive-core = {path = "hydra-drive-core"}


[build-dependencies]
embed-resource = "2"
winfsp = { version = "0.12", default-features = false, features = ["build","delayload"] }

