[package]
name = "hydra-drive-core"
version = "0.1.0"
edition = "2024"

[dependencies]
winfsp = { version = "0.12", features = ["build"] }
sysinfo = "0.33"
widestring = "1"
windows-sys = { version = "0.60", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
    "Win32_System_Memory",
    "Win32_System_Registry",   # <- add this
    "Win32_Security",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
